<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<title>Game Center</title>

<style>

body {
    margin:0;
    font-family:Arial;
    color:white;
    text-align:center;
    background:linear-gradient(120deg,#0d0d0d,#5b21b6,#0ea5e9);
    background-size:300% 300%;
    animation:wind 8s infinite alternate;
}

@keyframes wind {
    from {background-position:left;}
    to {background-position:right;}
}

.intro {
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(120deg,#000,#5b21b6,#0ea5e9);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
    animation:hide 4s forwards;
}

@keyframes hide {
    0% {opacity:1;}
    80% {opacity:1;}
    100% {
        opacity:0;
        visibility:hidden;
    }
}
